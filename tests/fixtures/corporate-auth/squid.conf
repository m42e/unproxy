# Kerberos only: no NTLM or Basic fallback and no anonymous destination bypass.
http_port 127.0.0.1:63128
visible_hostname localhost
auth_param negotiate program /usr/lib/squid/negotiate_kerberos_auth -s HTTP/localhost@UNPROXY.TEST
auth_param negotiate children 5
auth_param negotiate keep_alive on
acl authenticated proxy_auth alice@UNPROXY.TEST
acl fixture_origin dst 127.0.0.1/32
acl fixture_port port 61880
http_access allow authenticated fixture_origin fixture_port
http_access deny all
cache deny all
