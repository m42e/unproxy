name: validate
on:
  push:
  pull_request:
jobs:
  runtime:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      - run: cargo test --locked --no-default-features
      - run: cargo build --locked --release --bins
      - run: cargo run --locked --bin xtask -- docs --repository "${{ github.repository }}"
      - run: cargo run --locked --bin xtask -- package --format portable
      - if: runner.os == 'Linux'
        run: cargo run --locked --bin xtask -- package --format deb
      - if: runner.os == 'macOS'
        run: |
          cargo run --locked --bin xtask -- package --format macos
          cargo run --locked --bin xtask -- package --format app
      - if: runner.os == 'Windows'
        run: cargo run --locked --bin xtask -- package --format windows
      - uses: actions/upload-artifact@v4
        with:
          name: products-${{ runner.os }}-${{ runner.arch }}
          path: dist/
  cross:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-pc-windows-gnu, aarch64-unknown-linux-gnu, i686-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: rustup target add ${{ matrix.target }}
      - run: cargo install cross --locked
      - run: cross build --locked --target ${{ matrix.target }} --features vendored-tls --bins
  macos-x86:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - run: cargo build --locked --release --target x86_64-apple-darwin --bins
