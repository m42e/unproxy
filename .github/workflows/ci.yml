name: validate
on:
  push:
  pull_request:
jobs:
  runtime:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      - run: cargo test --locked --no-default-features
      - run: cargo xtask docs --repository "${{ github.repository }}"
      - run: cargo xtask package --format native
      - uses: actions/upload-artifact@v4
        with:
          name: products-${{ runner.os }}-${{ runner.arch }}
          path: dist/
  cross:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-pc-windows-gnu, aarch64-unknown-linux-gnu, i686-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: rustup target add ${{ matrix.target }}
      - run: cargo install cross --locked
      - run: cross build --locked --target ${{ matrix.target }} --features vendored-tls --bins
  macos-x86:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - run: cargo build --locked --release --target x86_64-apple-darwin --bins

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-llvm-cov --version 0.8.5 --locked
      - run: cargo llvm-cov clean --workspace
      - run: cargo llvm-cov --locked --all-features --workspace --lcov --output-path coverage-all-features.lcov
      - run: cargo llvm-cov clean --workspace
      - run: cargo llvm-cov --locked --no-default-features --workspace --lcov --output-path coverage-no-default-features.lcov
      - name: Record coverage environment
        run: |
          {
            echo "commit=${GITHUB_SHA}"
            echo "os=$(uname -a)"
            echo "rustc=$(rustc --version)"
            echo "cargo_llvm_cov=$(cargo llvm-cov --version)"
            echo "features=all-features and no-default-features"
            echo "branch_metrics=unavailable in the generated Rust coverage report"
          } > coverage-metadata.txt
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ runner.os }}-${{ runner.arch }}
          path: |
            coverage-*.lcov
            coverage-metadata.txt
