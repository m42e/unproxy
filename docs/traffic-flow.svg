<svg xmlns="http://www.w3.org/2000/svg" width="390" height="710" viewBox="0 0 390 710" role="img" aria-labelledby="title description">
  <title id="title">How Unproxy routes application traffic</title>
  <desc id="description">An application sends HTTP requests and HTTPS CONNECT tunnels to Unproxy at 127.0.0.1:3128. Unproxy evaluates PAC for each destination and connects directly or through an HTTP or HTTPS proxy, handling Basic or Negotiate authentication.</desc>
  <style>
    .card { fill: #f5f8fa; stroke: #d5e0e5; }
    .proxy { fill: #e8f5f1; stroke: #16776d; }
    .route { fill: #f5f8fa; stroke: #8fa6b1; }
    .ink { fill: #203541; }
    .muted { fill: #5a707c; }
    .line { fill: none; stroke: #78909c; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .arrow { fill: #78909c; }
    @media (prefers-color-scheme: dark) {
      .card, .route { fill: #1a2932; stroke: #3c505b; }
      .proxy { fill: #1b3836; stroke: #76d6bd; }
      .ink { fill: #e2eaf0; }
      .muted { fill: #a2b3c2; }
      .line { stroke: #90a8b3; }
      .arrow { fill: #90a8b3; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  </style>

  <rect class="card" x="24" y="24" width="342" height="105" rx="14" />
  <text class="muted" x="48" y="54" font-size="12" font-weight="700" letter-spacing="1.4">APPLICATION</text>
  <text class="ink" x="48" y="84" font-size="18" font-weight="650">Browser, CLI, or service</text>
  <text class="muted" x="48" y="110" font-size="14">HTTP + HTTPS CONNECT</text>

  <path class="line" d="M195 129v27" />
  <path class="arrow" d="M195 166l-6-10h12z" />

  <rect class="proxy" x="24" y="168" width="342" height="122" rx="14" />
  <text class="ink" x="48" y="199" font-size="12" font-weight="700" letter-spacing="1.4">UNPROXY</text>
  <text class="ink" x="48" y="231" font-size="18" font-weight="650">Local HTTP proxy</text>
  <text class="muted" x="48" y="263" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">127.0.0.1:3128</text>

  <text class="muted" x="195" y="322" font-size="13" text-anchor="middle">Evaluate PAC per destination</text>
  <path class="line" d="M195 290v42" />
  <path class="arrow" d="M195 342l-6-10h12z" />

  <rect class="card" x="24" y="344" width="342" height="108" rx="14" />
  <text class="muted" x="48" y="375" font-size="12" font-weight="700" letter-spacing="1.4">PAC POLICY</text>
  <text class="ink" x="48" y="407" font-size="18" font-weight="650">Choose a route for this destination</text>
  <text class="muted" x="48" y="433" font-size="14">Direct or upstream proxy</text>

  <path class="line" d="M195 452v36H107v23" />
  <path class="arrow" d="M107 521l-6-10h12z" />
  <path class="line" d="M195 488h88v23" />
  <path class="arrow" d="M283 521l-6-10h12z" />

  <rect class="route" x="24" y="523" width="166" height="154" rx="14" />
  <text class="ink" x="42" y="555" font-size="14" font-weight="700">DIRECT</text>
  <text class="muted" x="42" y="582" font-size="13">Connect to the</text>
  <text class="muted" x="42" y="602" font-size="13">destination</text>

  <rect class="route" x="200" y="523" width="166" height="154" rx="14" />
  <text class="ink" x="218" y="555" font-size="13" font-weight="700">UPSTREAM PROXY</text>
  <text class="muted" x="218" y="582" font-size="13">HTTP / HTTPS</text>
  <text class="muted" x="218" y="605" font-size="12">Basic / Negotiate</text>
  <text class="muted" x="218" y="628" font-size="12">authentication</text>
</svg>
